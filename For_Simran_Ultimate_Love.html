<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ff5f8f,#ffd6e8);overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:rgba(255,255,255,.95);padding:24px;border-radius:22px;width:90%;max-width:430px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
input,button{padding:12px 18px;border-radius:25px;border:1px solid #ccc;margin:8px}
button{background:#e91e63;color:#fff;border:none;font-size:16px}
#step2,#gallery{display:none}
img{width:100%;height:430px;object-fit:cover;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.heart,.rose,.spark{position:fixed;pointer-events:none}
.heart{top:-20px;animation:fall 6s linear forwards}
.rose{top:-20px;animation:fall 8s linear forwards}
.spark{animation:pop 1s ease-out forwards;font-size:28px}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}
@keyframes pop{to{transform:scale(3);opacity:0}}
#letter{font-style:italic;color:#b0004f}
</style></head><body>

let idx=0;
function login(){
 if(document.getElementById('pw').value.trim().toLowerCase()==='love'){
   loginDiv=document.getElementById('login');
   loginDiv.style.display='none';
   document.getElementById('step2').style.display='block';
 } else alert('Wrong password');
}
function openLove(){
 document.getElementById('step2').style.display='none';
 document.getElementById('gallery').style.display='block';
 let p=document.getElementById('pic');
 p.src=photos[0];
 setInterval(()=>{idx=(idx+1)%photos.length;p.src=photos[idx];},2500);
 setInterval(()=>{
   let h=document.createElement('div');
   h.className='heart';h.innerHTML=Math.random()>0.5?'💖':'❤️';
   h.style.left=Math.random()*100+'vw';
   h.style.fontSize=(18+Math.random()*24)+'px';
   document.body.appendChild(h);setTimeout(()=>h.remove(),6000);
 },180);
 setInterval(()=>{
   let r=document.createElement('div');
   r.className='rose';r.innerHTML='🌹';
   r.style.left=Math.random()*100+'vw';
   r.style.fontSize=(18+Math.random()*16)+'px';
   document.body.appendChild(r);setTimeout(()=>r.remove(),8000);
 },700);
 for(let i=0;i<50;i++){
   let s=document.createElement('div');
   s.className='spark';
   s.innerHTML=['🎆','✨','💖'][Math.floor(Math.random()*3)];
   s.style.left=(20+Math.random()*60)+'vw';
   s.style.top=(15+Math.random()*60)+'vh';
   document.body.appendChild(s);
   setTimeout(()=>s.remove(),1000);
 }
}
</script></body></html>
